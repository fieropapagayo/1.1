<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=nullbyte.html">
<title>CHITIAN // Redirecting...</title>
<style>
  body {
    background: #05060a;
    color: #f0f1f5;
    font-family: ui-monospace, monospace;
    display: grid;
    place-items: center;
    height: 100vh;
    margin: 0;
  }
  .loader {
    text-align: center;
  }
  .loader h1 {
    font-size: 24px;
    margin-bottom: 12px;
    letter-spacing: -.02em;
  }
  .loader h1 b { color: #ff2b3a; }
  .loader p {
    color: #5c6275;
    font-size: 13px;
  }
  .bar {
    width: 200px;
    height: 2px;
    background: #1e2230;
    border-radius: 2px;
    margin: 20px auto 0;
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #ff2b3a, #b8121e);
    animation: load 1.5s ease forwards;
  }
  @keyframes load { to { width: 100%; } }
</style>
</head>
<body>
<div class="loader">
  <h1><b>CHITIAN</b> //</h1>
  <p>Redirecting to store...</p>
  <div class="bar"><i></i></div>
</div>
</body>
</html>
